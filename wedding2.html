<script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      const container = document.getElementById('canva-container');
      
      setInterval(function() {
        const containerBottom = container.offsetTop + container.offsetHeight;
        
        // Check if the user has scrolled to or past the bottom of the Canva container
        if (window.scrollY + window.innerHeight >= containerBottom) {
          // Instantly jump back to the top of the container
          window.scrollTo({ top: container.offsetTop, behavior: 'instant' });
        } else {
          // Continue scrolling down
          window.scrollBy({ top: 2, behavior: 'smooth' });
        }
      }, 30); // Adjust interval delay to change scroll speed
    }, 1000);
  });
</script>
